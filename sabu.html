<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>活動歴 | メガ・ウルトラギガ 非公式ファンサイト</title>

    <meta
        name="description"
        content="メガ・ウルトラギガの活動歴・歴史をまとめたページです。"
    >

    <link
        rel="icon"
        href="icon.webp"
        type="image/webp"
    >

    <!-- 独自CSS -->
    <link
        rel="stylesheet"
        href="sabustyle.css"
    >

</head>


<body>


    <!-- ==================================================
         HEADER
         ================================================== -->

    <header class="history-header">

        <div class="history-header-inner">

            <a
                href="index.html"
                class="back-link"
            >
                ← HOME
            </a>


            <div class="history-header-title">

                <span class="history-subtitle">
                    MEGA ULTRA GIGA
                </span>

                <h1>
                    HISTORY
                </h1>

                <p>
                    活動歴
                </p>

            </div>

        </div>

    </header>



    <!-- ==================================================
         MAIN
         ================================================== -->

    <main class="history-container">


        <!-- ==================================================
             HISTORY LIST

             ここに出来事を追加していくだけです。

             data-year="2026"
             data-month="10"
             data-day="8"

             ↓

             年月日の判別用。
             画面には表示されません。

             表示されるのは、

             10月8日
             ○○を開始

             の部分です。
             ================================================== -->


        <section
            class="history-list"
            id="historyList"
        >


            <!-- ==================================================
                 2026
                 ================================================== -->


            <article
                class="history-item"
                data-year="2026"
                data-month="10"
                data-day="8"
            >

                <div class="history-date">
                    10月8日
                </div>

                <div class="history-event">
                    活動を開始
                </div>

            </article>



            <article
                class="history-item"
                data-year="2026"
                data-month="8"
                data-day="5"
            >

                <div class="history-date">
                    8月5日
                </div>

                <div class="history-event">
                    Tetria 歌枠リレー Connecting に参加
                </div>

            </article>



            <article
                class="history-item"
                data-year="2026"
                data-month="7"
                data-day="20"
            >

                <div class="history-date">
                    7月20日
                </div>

                <div class="history-event">
                    新しい活動を開始
                </div>

            </article>



            <!-- ==================================================
                 2025
                 ================================================== -->


            <article
                class="history-item"
                data-year="2025"
                data-month="12"
                data-day="25"
            >

                <div class="history-date">
                    12月25日
                </div>

                <div class="history-event">
                    クリスマス配信を実施
                </div>

            </article>



            <article
                class="history-item"
                data-year="2025"
                data-month="10"
                data-day="1"
            >

                <div class="history-date">
                    10月1日
                </div>

                <div class="history-event">
                    新ビジュアルを公開
                </div>

            </article>



            <article
                class="history-item"
                data-year="2025"
                data-month="6"
                data-day="15"
            >

                <div class="history-date">
                    6月15日
                </div>

                <div class="history-event">
                    大きな目標を発表
                </div>

            </article>



            <!-- ==================================================
                 2024
                 ================================================== -->


            <article
                class="history-item"
                data-year="2024"
                data-month="12"
                data-day="31"
            >

                <div class="history-date">
                    12月31日
                </div>

                <div class="history-event">
                    年末配信を実施
                </div>

            </article>



            <article
                class="history-item"
                data-year="2024"
                data-month="8"
                data-day="10"
            >

                <div class="history-date">
                    8月10日
                </div>

                <div class="history-event">
                    初めてのイベントに参加
                </div>

            </article>



            <article
                class="history-item"
                data-year="2024"
                data-month="4"
                data-day="1"
            >

                <div class="history-date">
                    4月1日
                </div>

                <div class="history-event">
                    活動に関する発表
                </div>

            </article>


        </section>



        <!-- ==================================================
             END
             ================================================== -->

        <div class="history-end">

            <span class="history-end-line"></span>

            <p>
                HISTORY END
            </p>

            <span class="history-end-line"></span>

        </div>


    </main>



    <!-- ==================================================
         FOOTER
         ================================================== -->

    <footer class="history-footer">

        <a
            href="index.html"
            class="home-button"
        >
            HOMEへ戻る
        </a>


        <p class="copyright">
            &copy; 2026 Koqi
        </p>


        <p class="copyright-sub">

        </p>

    <script src="sabu.js"></script>
